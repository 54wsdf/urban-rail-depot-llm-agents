openapi: 3.1.0
info:
  title: Depot Role-Agent Interface
  version: 0.2.0
paths:
  /v1/protocol:
    get:
      responses:
        "200":
          description: Public role, channel, action, and gate contract
  /v1/respond:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./contracts/api.schema.json#/$defs/respond_request"
      responses:
        "200":
          description: One role response
  /v1/episode:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./contracts/api.schema.json#/$defs/episode_request"
      responses:
        "200":
          description: Event-driven directed negotiation episode
  /v1/admission:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./contracts/api.schema.json#/$defs/admission_request"
      responses:
        "200":
          description: Generator-blind twelve-gate admission certificate
  /v1/commit:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./contracts/api.schema.json#/$defs/commit_request"
      responses:
        "200":
          description: Compare-and-swap state commit after successful admission
