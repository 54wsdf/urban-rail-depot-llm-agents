name: Temp probe Mendeley Sydney dataset

on:
  push:
    paths:
      - .github/workflows/temp-probe-mendeley-sydney.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve ZIP size by ranged GET
        run: |
          set -euo pipefail
          BASE='https://data.mendeley.com/public-api/zip/gstfpzg339/download/1'
          curl -sS -D redirect.headers -o redirect.body "$BASE"
          SIGNED=$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^location:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' redirect.headers)
          test -n "$SIGNED"
          curl -sS -D range.headers -H 'Range: bytes=0-0' "$SIGNED" -o first.byte
          cat range.headers
          TOTAL=$(awk 'BEGIN{IGNORECASE=1} /^content-range:/{gsub(/\r/,""); split($0,a,"/"); print a[2]; exit}' range.headers)
          printf 'total_bytes=%s\n' "$TOTAL" | tee size.txt
          test -n "$TOTAL"
          test "$(wc -c < first.byte)" -eq 1

      - name: Upload size probe
        uses: actions/upload-artifact@v4
        with:
          name: mendeley-sydney-size-probe
          path: |
            redirect.headers
            range.headers
            size.txt
            first.byte
          retention-days: 2
