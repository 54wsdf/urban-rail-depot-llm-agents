name: Temp probe Mendeley Sydney dataset

on:
  push:
    paths:
      - .github/workflows/temp-probe-mendeley-sydney.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe anonymous ZIP route
        run: |
          set -euo pipefail
          URL='https://data.mendeley.com/public-api/zip/gstfpzg339/download/1'
          echo "$URL"
          curl -sS -L -I --max-time 120 "$URL" | tee headers.txt
          curl -sS -L --range 0-1048575 --max-time 120 "$URL" -o first.bin
          file first.bin
          wc -c first.bin
          sha256sum first.bin

      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: mendeley-sydney-zip-head
          path: |
            headers.txt
            first.bin
          retention-days: 2
