name: Temp fetch Mendeley Sydney dataset

on:
  push:
    paths:
      - .github/workflows/temp-probe-mendeley-sydney.yml

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download complete Sydney archive and audit
        run: |
          set -euo pipefail
          BASE='https://data.mendeley.com/public-api/zip/gstfpzg339/download/1'
          curl -fL --retry 3 --connect-timeout 30 --max-time 900 "$BASE" -o Sydney_GTFSRT_Mendeley_gstfpzg339_v1.zip
          test "$(stat -c%s Sydney_GTFSRT_Mendeley_gstfpzg339_v1.zip)" -eq 178330829
          sha256sum Sydney_GTFSRT_Mendeley_gstfpzg339_v1.zip > SHA256SUMS.txt
          unzip -t Sydney_GTFSRT_Mendeley_gstfpzg339_v1.zip > ZIP_TEST.txt
          unzip -l Sydney_GTFSRT_Mendeley_gstfpzg339_v1.zip > ZIP_CONTENTS.txt
          cat SHA256SUMS.txt
          tail -5 ZIP_TEST.txt
          head -40 ZIP_CONTENTS.txt

      - name: Upload Sydney archive
        uses: actions/upload-artifact@v4
        with:
          name: sydney-gtfsrt-gstfpzg339-v1
          path: |
            Sydney_GTFSRT_Mendeley_gstfpzg339_v1.zip
            SHA256SUMS.txt
            ZIP_TEST.txt
            ZIP_CONTENTS.txt
          compression-level: 0
          retention-days: 2
