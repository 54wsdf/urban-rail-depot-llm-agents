name: Temp Hangzhou AFC gzip transfer

on:
  push:
    paths:
      - .github/workflows/temp-hangzhou-afc-gzip.yml

jobs:
  afc:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - {date: '2019-01-01', file_id: '64951788', sha: '4a73fed85bc00182ccad2518dace20b72163b0e0f0f552700a4a1580c8803dcd'}
          - {date: '2019-01-02', file_id: '64951773', sha: '5ecf8117c334a7df2e66296ec69dd3dfdaca587226ada1fb393a4051c0d541d4'}
          - {date: '2019-01-03', file_id: '64951764', sha: '6c21a97179c817be85133c05d7508fd97f5d983efb7635cbeb70d7fe2ab4e335'}
          - {date: '2019-01-04', file_id: '64951785', sha: '5440cea3623b645debeb1d5d4f27695636b68c940fe916278a649e307fa18b5b'}
          - {date: '2019-01-05', file_id: '64951758', sha: '7bd0460d16a1b93c8873428af6e7ec1bea28eb197f29d9d542164a9f0e7f15f4'}
          - {date: '2019-01-06', file_id: '64951755', sha: '484fd105c9150e97cec9a9ba249989a4b5735fe7afa10e995563196720dc9e6c'}
          - {date: '2019-01-07', file_id: '64951770', sha: 'afb12c47cef36aff5b031f582c05ad79d5a57eb2f3f4b24293ec44334b37c8cf'}
          - {date: '2019-01-08', file_id: '64951779', sha: '9a881d8a53da6b4833847fb30806ea771c234b147570590ddba126586689fb82'}
          - {date: '2019-01-09', file_id: '64951776', sha: '9ff48cb7a5a8272de32c38534739afb87d653bb561529b7d55776f97c32fee0f'}
          - {date: '2019-01-10', file_id: '64951791', sha: '92be7171632dfaf3aba6025309cc034877dbcba8cb37c733583e9592c1a89325'}
          - {date: '2019-01-11', file_id: '64951803', sha: '0b9fe0bc0d9c359fa26e4b1068737831eaf4aff1386d25186864f2db2dca7f27'}
          - {date: '2019-01-12', file_id: '64951767', sha: 'b41e87a27bbd9633b0476d93c9f5baa9d6b9dd1b62c702f53feaf512115aac2b'}
          - {date: '2019-01-13', file_id: '64951761', sha: '7cb8372a39e06f8d5e23b7e7bb498ac0baa9037270e1e72e9de0bccea3120c98'}
          - {date: '2019-01-14', file_id: '64951800', sha: '6d911306a89c5e67142f6f88fdf43f0e4c80d90bd9f3897f95e0b28b0e9f5cb0'}
          - {date: '2019-01-15', file_id: '64951797', sha: 'e179f1b4aecee63ba69544424254eaa3e8c5b39e5963cb0fa8ce7778d107d2ce'}
          - {date: '2019-01-16', file_id: '64951806', sha: 'b6d1e0ff0a4179fc3964b8352c77f3959462c0eda5c1d38060984eda9f3826e2'}
          - {date: '2019-01-17', file_id: '64951809', sha: 'bfc84a40b45d40673b1a198fdcc95fe0303503d2f563180c2c79fa19f5bbeb72'}
          - {date: '2019-01-18', file_id: '64951818', sha: 'abc265cad57158c46ca6817737e7f8101b88f3bd8c743159ce244c6d7e537261'}
          - {date: '2019-01-19', file_id: '64951794', sha: '55ef9da2a2d09a4e680125b5f826f1403f6115587b7b3f6ee612f66e0e868518'}
          - {date: '2019-01-20', file_id: '64951782', sha: '888f536d97f55472065c15a8183010ce1ee7cd83866433d1145822f687bd15d0'}
          - {date: '2019-01-21', file_id: '64951812', sha: '0ed821844b8a44d44ff4554d9675fcfc83912a526d03b7130628e85e94e5a376'}
          - {date: '2019-01-22', file_id: '64951815', sha: 'cc534d0952eb10e2f5f7bb8713c7aa1b57baeed5c8b7946f5b916a09827cc5e6'}
          - {date: '2019-01-23', file_id: '64951821', sha: '4311ea4685e0d1eaf20be48fe9e65128994396c88346d6726571ec79da4c4c65'}
          - {date: '2019-01-24', file_id: '64951824', sha: 'eadef219fbce912c0f6c01f7e6a1bdf78310d3281bc843d486d8c404069a6738'}
          - {date: '2019-01-25', file_id: '64951827', sha: 'd4ea5370cae3f7480bae106ac86f14be285f3a36885caae9cf1f86c152d5a836'}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download verify gzip
        env:
          DATE: ${{ matrix.date }}
          FILE_ID: ${{ matrix.file_id }}
          EXPECTED_SHA: ${{ matrix.sha }}
        run: |
          set -euo pipefail
          name="record_${DATE}.csv"
          curl -fL --retry 3 "https://ndownloader.figshare.com/files/${FILE_ID}" -o "$name"
          echo "$EXPECTED_SHA  $name" | sha256sum -c -
          orig_size=$(stat -c%s "$name")
          gzip -n -6 "$name"
          gz_size=$(stat -c%s "$name.gz")
          gz_sha=$(sha256sum "$name.gz" | awk '{print $1}')
          printf 'date=%s\nfigshare_file_id=%s\noriginal_sha256=%s\noriginal_size=%s\ngzip_sha256=%s\ngzip_size=%s\n' "$DATE" "$FILE_ID" "$EXPECTED_SHA" "$orig_size" "$gz_sha" "$gz_size" > "record_${DATE}.manifest.txt"
          cat "record_${DATE}.manifest.txt"

      - name: Upload daily AFC
        uses: actions/upload-artifact@v4
        with:
          name: hz-afc-${{ matrix.date }}-gzip
          path: |
            record_${{ matrix.date }}.csv.gz
            record_${{ matrix.date }}.manifest.txt
          compression-level: 0
          retention-days: 7

  aux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and verify auxiliary files
        run: |
          set -euo pipefail
          mkdir -p aux
          dl() { id="$1"; name="$2"; sha="$3"; curl -fL --retry 3 "https://ndownloader.figshare.com/files/$id" -o "aux/$name"; echo "$sha  aux/$name" | sha256sum -c -; }
          dl 64950015 'Passenger Flow.xlsx' c66163fe131f3bfcce7919f4f8b0b43d8d2b9efdf723e3b26d8705a6dd7b9e01
          dl 64950018 'Metro_roadMap.csv' d2e3d362551d6fbf3cc6930f2fa9520e91fa0a2ae90b9a2b010eb42b0b128a09
          dl 65124519 'L2_Route Reselection.csv' f0db4d35e7f3e12de9f0f589d8c6953c05c3dd0335dd70c44beab47b95e98470
          dl 65124522 'L3_Route Reselection.csv' 76c91c801a6c7732fd9b4563f8bdcf280bd77d85744a9f7770aad14814195b4b
          dl 65124525 'L1_Route Reselection.csv' 3dd3c58f257d44aa74047fc4a42a25356ea7805e84bc494ab7c674f627b4d520
          dl 65124528 'Train Timetable.xlsx' e69857332eb7b3b720abf702a60acfcb322a4ded26085a76521dcd86c86c1551
          curl -fL --retry 3 'https://api.figshare.com/v2/articles/31431739' -o aux/FIGSHARE_METADATA.json
          sha256sum aux/* > aux/SHA256SUMS.txt

      - name: Upload auxiliary package
        uses: actions/upload-artifact@v4
        with:
          name: hz-figshare-31431739-aux
          path: aux
          compression-level: 0
          retention-days: 7
