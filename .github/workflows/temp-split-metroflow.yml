name: Temp split MetroFlow for Drive transfer

on:
  push:
    paths:
      - .github/workflows/temp-split-metroflow.yml

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download and split MetroFlow
        run: |
          set -euo pipefail
          mkdir -p parts
          curl -fL --retry 3 'https://ndownloader.figshare.com/files/54996461' -o MetroFlow.zip
          echo '79d679873e36cd01e7f009ecbac1698d1c8b123a4d77a9047458d09ba5bcd670  MetroFlow.zip' | sha256sum -c -
          split -b 400M -a 2 MetroFlow.zip parts/MetroFlow.zip.part.
          sha256sum parts/* > parts/SHA256SUMS_PARTS.txt
          ls -lh parts

      - name: Upload part aa
        uses: actions/upload-artifact@v4
        with:
          name: MetroFlow-part-aa
          path: parts/MetroFlow.zip.part.aa
          compression-level: 0
          retention-days: 7

      - name: Upload part ab
        uses: actions/upload-artifact@v4
        with:
          name: MetroFlow-part-ab
          path: parts/MetroFlow.zip.part.ab
          compression-level: 0
          retention-days: 7

      - name: Upload part ac
        uses: actions/upload-artifact@v4
        with:
          name: MetroFlow-part-ac
          path: parts/MetroFlow.zip.part.ac
          compression-level: 0
          retention-days: 7

      - name: Upload split manifest
        uses: actions/upload-artifact@v4
        with:
          name: MetroFlow-split-manifest
          path: parts/SHA256SUMS_PARTS.txt
          retention-days: 7
