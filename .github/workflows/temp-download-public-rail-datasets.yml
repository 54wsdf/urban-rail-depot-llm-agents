name: Temp download public rail datasets

on:
  push:
    paths:
      - .github/workflows/temp-download-public-rail-datasets.yml

jobs:
  figshare:
    strategy:
      fail-fast: false
      matrix:
        article_id: [28844942, 31431739]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download Figshare item
        env:
          ARTICLE_ID: ${{ matrix.article_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, urllib.request, hashlib
          aid = os.environ['ARTICLE_ID']
          root = pathlib.Path('out')
          root.mkdir(exist_ok=True)
          api = f'https://api.figshare.com/v2/articles/{aid}'
          with urllib.request.urlopen(api, timeout=60) as r:
              meta = json.load(r)
          (root/'FIGSHARE_METADATA.json').write_text(json.dumps(meta, ensure_ascii=False, indent=2), encoding='utf-8')
          files = meta.get('files', [])
          total = sum(int(f.get('size') or 0) for f in files)
          report = {'article_id': aid, 'title': meta.get('title'), 'total_bytes': total, 'file_count': len(files), 'files': []}
          max_total = 9 * 1024**3
          if total > max_total:
              report['status'] = 'metadata_only_total_exceeds_runner_limit'
          else:
              for f in files:
                  name = f.get('name') or str(f.get('id'))
                  url = f.get('download_url')
                  size = int(f.get('size') or 0)
                  rec = {'name': name, 'size': size, 'download_url': url}
                  target = root/name
                  try:
                      urllib.request.urlretrieve(url, target)
                      h = hashlib.sha256()
                      with target.open('rb') as fh:
                          for chunk in iter(lambda: fh.read(8*1024*1024), b''):
                              h.update(chunk)
                      rec['sha256'] = h.hexdigest()
                      rec['status'] = 'downloaded'
                  except Exception as e:
                      rec['status'] = 'download_error'
                      rec['error'] = repr(e)
                  report['files'].append(rec)
              report['status'] = 'download_attempt_complete'
          (root/'DOWNLOAD_REPORT.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Upload Figshare item
        uses: actions/upload-artifact@v4
        with:
          name: figshare-${{ matrix.article_id }}-20260825
          path: out
          retention-days: 7
          compression-level: 0

  mendeley:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Attempt Mendeley dataset ZIP
        run: |
          set +e
          mkdir -p out
          URL='https://api.data.mendeley.com/datasets/gstfpzg339/zip/file_downloaded?version=1'
          echo "$URL" > out/SOURCE_URL.txt
          curl -L --retry 2 --connect-timeout 30 --max-time 1800 -w '\nHTTP_CODE=%{http_code}\nSIZE=%{size_download}\n' "$URL" -o out/gstfpzg339_v1.zip > out/CURL_REPORT.txt 2>&1
          RC=$?
          echo "curl_exit_code=$RC" >> out/CURL_REPORT.txt
          if [ -s out/gstfpzg339_v1.zip ]; then
            file out/gstfpzg339_v1.zip >> out/CURL_REPORT.txt
            sha256sum out/gstfpzg339_v1.zip > out/SHA256SUMS.txt
          fi
          cat out/CURL_REPORT.txt
          exit 0

      - name: Upload Mendeley result
        uses: actions/upload-artifact@v4
        with:
          name: mendeley-gstfpzg339-v1-20260825
          path: out
          retention-days: 7
          compression-level: 0
