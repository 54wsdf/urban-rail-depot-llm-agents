name: tmp-lamp-acquire
on:
  push:
    branches: [tmp/lamp-acquisition-20260825]
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - name: Download public MBTA LAMP index and realized subway data
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p lamp
          curl -fL --retry 3 -o lamp/index.csv https://performancedata.mbta.com/lamp/subway-on-time-performance-v1/index.csv
          echo '--- index tail ---'
          tail -n 20 lamp/index.csv || true
          for d in 2026-08-19 2026-08-20 2026-08-21 2026-08-22 2026-08-23; do
            u="https://performancedata.mbta.com/lamp/subway-on-time-performance-v1/${d}-subway-on-time-performance-v1.parquet"
            if curl -fL --retry 3 -o "lamp/${d}-subway-on-time-performance-v1.parquet" "$u"; then
              sha256sum "lamp/${d}-subway-on-time-performance-v1.parquet" >> lamp/SHA256SUMS.txt
            else
              rm -f "lamp/${d}-subway-on-time-performance-v1.parquet"
            fi
          done
          ls -lh lamp
          cat lamp/SHA256SUMS.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: mbta-lamp-20260825
          path: lamp/
          retention-days: 7
