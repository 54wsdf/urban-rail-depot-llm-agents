name: tmp-lamp-acquire
on:
  push:
    branches: [tmp/lamp-acquisition-20260825]
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - name: Download and convert public MBTA LAMP data
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p lamp
          curl -fL --retry 3 -o lamp/index.csv https://performancedata.mbta.com/lamp/subway-on-time-performance-v1/index.csv
          python -m pip install --quiet pandas pyarrow
          for d in 2026-08-19 2026-08-20 2026-08-21 2026-08-22 2026-08-23; do
            u="https://performancedata.mbta.com/lamp/subway-on-time-performance-v1/${d}-subway-on-time-performance-v1.parquet"
            if curl -fL --retry 3 -o "lamp/${d}.parquet" "$u"; then
              sha256sum "lamp/${d}.parquet" >> lamp/SHA256SUMS_PARQUET.txt
              python -c "import pandas as pd,json; from pathlib import Path; d='$d'; p=Path('lamp')/(d+'.parquet'); df=pd.read_parquet(p); print(d,df.shape); print(df.columns.tolist()); df.to_csv(Path('lamp')/(d+'.csv.gz'),index=False,compression='gzip'); (Path('lamp')/(d+'-schema.json')).write_text(json.dumps({'date':d,'rows':len(df),'columns':list(df.columns)},indent=2))"
              rm "lamp/${d}.parquet"
            fi
          done
          ls -lh lamp
      - uses: actions/upload-artifact@v4
        with:
          name: mbta-lamp-csv-20260825
          path: lamp/
          retention-days: 7
