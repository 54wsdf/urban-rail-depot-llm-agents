name: Temp archive public rail data

on:
  push:
    paths:
      - .github/workflows/temp-archive-public-rail-data.yml

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Clone and package fixed public sources
        run: |
          set -euo pipefail
          mkdir -p rail_archives vendor_tmp
          snapshot() {
            name="$1"
            url="$2"
            sha="$3"
            git clone --quiet --no-tags "$url" "vendor_tmp/$name"
            git -C "vendor_tmp/$name" checkout --quiet --detach "$sha"
            rm -rf "vendor_tmp/$name/.git"
            printf '%s\n' "$url" > "vendor_tmp/$name/UPSTREAM_URL.txt"
            printf '%s\n' "$sha" > "vendor_tmp/$name/UPSTREAM_COMMIT.txt"
            tar -czf "rail_archives/${name}.tar.gz" -C vendor_tmp "$name"
          }
          snapshot CN_SH_SODA_2015_jeevanyue_metro https://github.com/jeevanyue/metro.git bb78b72ecadc57e0c8deedf9731a78a65ab62ef4
          snapshot CN_SH_MetroFlow_2017 https://github.com/Ariza-Sun/MetroFlow.git 42f6ac6e8adc6497a06bc107af7c2092bd48dc64
          snapshot CN_BJ_2016_ResNet-LSTM-GCN https://github.com/JinleiZhangBJTU/ResNet-LSTM-GCN.git 78b257bb362d1d0b48bce6fda6250ed67b2e8381
          snapshot CN_SH_HZ_PVCGN https://github.com/HCPLab-SYSU/PVCGN.git 73bf7a73d3f48a8fdbca2e122fd61ac8c22714c7
          snapshot CN_HZ_AutoDwell https://github.com/AutoDwell/AutoDwell.git fb6c1328e317794ffd3646e4b5da9cf67572a4f5
          cd rail_archives
          sha256sum *.tar.gz > SHA256SUMS.txt

      - name: Upload source archives
        uses: actions/upload-artifact@v4
        with:
          name: rail-public-github-snapshots-20260825
          path: rail_archives
          retention-days: 7
