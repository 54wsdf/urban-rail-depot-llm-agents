name: tmp-mta-od-acquire
on:
  push:
    branches: [tmp/lamp-acquisition-20260825]
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - name: Query public 2026 MTA OD target subset
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p mtaod
          python - <<'PY'
          import requests, json, csv
          base='https://data.ny.gov/resource/28vm-gjqr.json'
          s=requests.Session()
          meta=s.get('https://data.ny.gov/api/views/28vm-gjqr',timeout=60); meta.raise_for_status()
          open('mtaod/metadata.json','w').write(json.dumps(meta.json(),indent=2))
          ids=['221','222','416','621','622']
          idlist=','.join(ids)
          # GTFS station complexes on the frozen 2->5->4->6 mechanism chain.
          # Representative current public OD slice: June 2026 Wednesdays, 07:00-09:59.
          where=f"month=6 AND day_of_week='Wednesday' AND hour_of_day between 7 and 9 AND (origin_station_complex_id in({idlist}) OR destination_station_complex_id in({idlist}))"
          q={'$select':'month,day_of_week,hour_of_day,origin_station_complex_id,origin_station_complex_name,destination_station_complex_id,destination_station_complex_name,estimated_average_ridership',
             '$where':where,'$limit':10000,'$offset':0}
          rows=[]
          while True:
              r=s.get(base,params=q,timeout=120); r.raise_for_status(); b=r.json(); rows+=b
              if len(b)<q['$limit']: break
              q['$offset']+=q['$limit']
          names={}
          agg={i:{'origin_ridership':0.0,'destination_ridership':0.0} for i in ids}
          for x in rows:
              oi=x.get('origin_station_complex_id'); di=x.get('destination_station_complex_id'); v=float(x.get('estimated_average_ridership') or 0)
              if oi in agg:
                  agg[oi]['origin_ridership']+=v; names[oi]=x.get('origin_station_complex_name')
              if di in agg:
                  agg[di]['destination_ridership']+=v; names[di]=x.get('destination_station_complex_name')
          for i in ids: agg[i]['name']=names.get(i)
          open('mtaod/subset.json','w').write(json.dumps(rows,indent=2))
          if rows:
              with open('mtaod/subset.csv','w',newline='') as f:
                  w=csv.DictWriter(f,fieldnames=list(rows[0])); w.writeheader(); w.writerows(rows)
          open('mtaod/target_complexes.json','w').write(json.dumps(names,indent=2))
          open('mtaod/target_intensity.json','w').write(json.dumps(agg,indent=2))
          open('mtaod/manifest.json','w').write(json.dumps({'dataset_id':'28vm-gjqr','rows':len(rows),'target_ids':ids,'where':where},indent=2))
          print('names',names); print('rows',len(rows)); print('intensity',agg)
          PY
          sha256sum mtaod/* > mtaod/SHA256SUMS.txt
          ls -lh mtaod
      - uses: actions/upload-artifact@v4
        with:
          name: mta-od-subset-20260825
          path: mtaod/
          retention-days: 7
