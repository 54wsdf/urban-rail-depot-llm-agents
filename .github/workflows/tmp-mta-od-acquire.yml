name: tmp-mta-od-acquire
on:
  push:
    branches: [tmp/lamp-acquisition-20260825]
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - name: Crosswalk GTFS stops to OD complexes with official stations dataset
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p mtaod
          curl -fL --retry 3 -o mtaod/stations_complexes.csv 'https://data.ny.gov/api/v3/views/5f5g-n3cz/export.csv?accessType=DOWNLOAD'
          python - <<'PY'
          import pandas as pd, requests, json, csv, re
          gtfs_ids=['221','222','416','621','622']
          st=pd.read_csv('mtaod/stations_complexes.csv',dtype=str)
          print('station columns',st.columns.tolist())
          # find likely GTFS/complex fields robustly
          def findcol(cands):
            for c in st.columns:
              z=c.lower().replace('_',' ').strip()
              if any(k in z for k in cands): return c
          gtfs_col=findcol(['gtfs stop','gtfs'])
          complex_col=findcol(['complex id'])
          name_col=findcol(['stop name','station name','complex name'])
          routes_col=findcol(['daytime routes','services','route'])
          print('mapped cols',gtfs_col,complex_col,name_col,routes_col)
          sel=st[st[gtfs_col].isin(gtfs_ids)].copy()
          # if exact parent rows are absent, allow N/S suffix stop IDs by prefix.
          if len(sel)<len(gtfs_ids):
            mask=st[gtfs_col].fillna('').map(lambda x:any(x==g or x.startswith(g+'N') or x.startswith(g+'S') for g in gtfs_ids))
            sel=st[mask].copy()
          sel.to_csv('mtaod/crosswalk_rows.csv',index=False)
          cross={}
          for g in gtfs_ids:
            r=sel[sel[gtfs_col].fillna('').map(lambda x:x==g or x.startswith(g+'N') or x.startswith(g+'S'))]
            if not r.empty:
              rr=r.iloc[0]
              cross[g]={'complex_id':str(rr[complex_col]),'name':None if pd.isna(rr[name_col]) else str(rr[name_col]),'gtfs_stop_id':str(rr[gtfs_col]),'routes':None if routes_col is None or pd.isna(rr[routes_col]) else str(rr[routes_col])}
          open('mtaod/crosswalk_selected.json','w').write(json.dumps(cross,indent=2))
          ids=sorted({x['complex_id'] for x in cross.values()},key=lambda x:int(float(x)))
          print('crosswalk',json.dumps(cross,indent=2)); print('od ids',ids)
          base='https://data.ny.gov/resource/28vm-gjqr.json'; s=requests.Session()
          meta=s.get('https://data.ny.gov/api/views/28vm-gjqr',timeout=60); meta.raise_for_status(); open('mtaod/metadata.json','w').write(json.dumps(meta.json(),indent=2))
          idlist=','.join(ids)
          where=f"month=6 AND day_of_week='Wednesday' AND hour_of_day between 7 and 9 AND (origin_station_complex_id in({idlist}) OR destination_station_complex_id in({idlist}))"
          q={'$select':'month,day_of_week,hour_of_day,origin_station_complex_id,origin_station_complex_name,destination_station_complex_id,destination_station_complex_name,estimated_average_ridership', '$where':where,'$limit':10000,'$offset':0}
          rows=[]
          while True:
            r=s.get(base,params=q,timeout=120); r.raise_for_status(); b=r.json(); rows+=b
            if len(b)<q['$limit']: break
            q['$offset']+=q['$limit']
          if rows:
            with open('mtaod/subset.csv','w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0])); w.writeheader(); w.writerows(rows)
          open('mtaod/subset.json','w').write(json.dumps(rows,indent=2))
          agg={i:{'origin_ridership':0.,'destination_ridership':0.} for i in ids}
          for x in rows:
            v=float(x.get('estimated_average_ridership') or 0); oi=x.get('origin_station_complex_id'); di=x.get('destination_station_complex_id')
            if oi in agg: agg[oi]['origin_ridership']+=v
            if di in agg: agg[di]['destination_ridership']+=v
          open('mtaod/target_intensity.json','w').write(json.dumps(agg,indent=2))
          open('mtaod/manifest.json','w').write(json.dumps({'od_dataset_id':'28vm-gjqr','station_crosswalk_dataset_id':'5f5g-n3cz','rows':len(rows),'crosswalk':cross,'where':where},indent=2))
          print('rows',len(rows)); print('intensity',agg)
          PY
          sha256sum mtaod/* > mtaod/SHA256SUMS.txt
          ls -lh mtaod
      - uses: actions/upload-artifact@v4
        with:
          name: mta-od-crosswalk-20260825
          path: mtaod/
          retention-days: 7
